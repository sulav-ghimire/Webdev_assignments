<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBite | Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body">
    <nav class="navbar admin-navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-utensils"></i> QuickBite Admin
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Back to Store</a></li>
        </ul>
    </nav>

    <div class="admin-container">
        <aside class="admin-sidebar">
            <ul>
                <li class="active" onclick="showAdminSection('manage-menu')">Manage Menu</li>
                <li onclick="showAdminSection('manage-orders')">View Orders</li>
            </ul>
        </aside>

        <main class="admin-main">
            <section id="manage-menu" class="admin-section active">
                <h2>Manage Menu Items</h2>
                <button class="primary-btn" onclick="openAddItemModal()">+ Add New Item</button>
                <div class="admin-menu-list">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="admin-menu-tbody">
                            <!-- Items injected here -->
                        </tbody>
                    </table>
                </div>
            </section>

            <section id="manage-orders" class="admin-section" style="display: none;">
                <h2>Customer Orders</h2>
                <div class="admin-order-list" id="admin-orders-list">
                    <!-- Orders injected here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Add/Edit Item Modal -->
    <div class="modal" id="item-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('item-modal')">&times;</span>
            <h2 id="modal-title">Add Menu Item</h2>
            <form id="item-form" onsubmit="saveMenuItem(event)">
                <input type="hidden" id="item-id">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="item-name" required>
                </div>
                <div class="form-group">
                    <label>Price</label>
                    <input type="number" step="0.01" id="item-price" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <input type="text" id="item-category" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="item-description" required></textarea>
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" id="item-image" required>
                </div>
                <button type="submit" class="primary-btn">Save Item</button>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="js/admin.js"></script>
</body>
</html>
