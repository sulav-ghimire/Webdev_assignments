<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBite | Food Delivery</title>
    <!-- Use FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-utensils"></i> QuickBite
        </div>
        <ul class="nav-links">
            <li><a href="#" onclick="showSection('menu')">Menu</a></li>
            <li><a href="#" onclick="showSection('orders')">Track Order</a></li>
            <li><a href="admin.html">Admin</a></li>
        </ul>
        <div class="cart-icon" onclick="toggleCart()">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cart-count">0</span>
        </div>
    </nav>

    <main id="main-content">
        <!-- Dashboard / Menu Section -->
        <section id="menu-section" class="active-section">
            <header class="hero">
                <h1>Delicious food, delivered to you</h1>
                <p>Explore our menu and order your favorites.</p>
            </header>
            
            <div class="category-filters" id="category-filters">
                <!-- Dynamically populated categories -->
            </div>

            <div class="menu-grid" id="menu-grid">
                <!-- Menu items injected here -->
            </div>
        </section>

        <!-- Order Tracking Section -->
        <section id="orders-section" style="display: none;">
            <h2>Your Orders</h2>
            <div id="order-list">
                <!-- Orders injected here -->
            </div>
        </section>
    </main>

    <!-- Cart Sidebar -->
    <aside class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="close-cart" onclick="toggleCart()"><i class="fa-solid fa-times"></i></button>
        </div>
        
        <div class="cart-items" id="cart-items">
            <!-- Cart items injected here -->
            <div class="empty-cart-msg">Your cart is empty.</div>
        </div>

        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total-price">Rs 0.00</span>
            </div>
            <button class="checkout-btn" onclick="checkout()"><i class="fa-solid fa-credit-card"></i> Checkout</button>
        </div>
    </aside>

    <!-- Checkout Modal -->
    <div class="modal" id="checkout-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('checkout-modal')">&times;</span>
            <h2>Checkout</h2>
            <form id="checkout-form" onsubmit="submitOrder(event)">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="address">Delivery Address</label>
                    <input type="text" id="address" required>
                </div>
                <button type="submit" class="primary-btn">Place Order</button>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast"></div>

    <script src="js/app.js"></script>
</body>
</html>
